<article class="post-content" data-component="post-content" data-editable="true" data-settings-group="blog" data-token-group="blog" data-version="1.0" data-reveal>
    <header class="post-content-header">
        <h1 class="post-content-title">{{TITLE}}</h1>
        <div class="post-content-meta">
            <span class="post-content-author">{{AUTHOR}}</span>
            <span class="post-content-date">{{DATE}}</span>
            <span class="post-content-category">{{CATEGORY}}</span>
        </div>
        <div class="post-content-featured">
            <img loading="lazy" src="{{IMAGE}}" alt="{{TITLE}}">
        </div>
    </header>
    <div class="post-content-body">
        {{CONTENT}}
    </div>
    <footer class="post-content-footer">
        <div class="post-content-tags">{{TAGS}}</div>
        <div class="post-content-share">{{SHARE}}</div>
    </footer>
</article>
