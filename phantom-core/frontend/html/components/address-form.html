<div class="address-form" data-component="address-form" data-editable="true" data-settings-group="checkout" data-token-group="checkout" data-version="1.0" data-reveal>
    <form class="address-form-fields" method="post" action="{{ACTION_URL}}">
        <div class="address-form-row">
            <label for="address-name">{{NAME_LABEL}}</label>
            <input type="text" id="address-name" name="name" value="{{NAME}}" required>
        </div>
        <div class="address-form-row">
            <label for="address-line1">{{LINE1_LABEL}}</label>
            <input type="text" id="address-line1" name="line1" value="{{LINE1}}" required>
        </div>
        <div class="address-form-row">
            <label for="address-line2">{{LINE2_LABEL}}</label>
            <input type="text" id="address-line2" name="line2" value="{{LINE2}}">
        </div>
        <div class="address-form-row">
            <label for="address-city">{{CITY_LABEL}}</label>
            <input type="text" id="address-city" name="city" value="{{CITY}}" required>
        </div>
        <div class="address-form-row">
            <label for="address-state">{{STATE_LABEL}}</label>
            <input type="text" id="address-state" name="state" value="{{STATE}}" required>
        </div>
        <div class="address-form-row">
            <label for="address-zip">{{ZIP_LABEL}}</label>
            <input type="text" id="address-zip" name="zip" value="{{ZIP}}" required>
        </div>
        <div class="address-form-row">
            <label for="address-country">{{COUNTRY_LABEL}}</label>
            <select id="address-country" name="country">{{COUNTRY_OPTIONS}}</select>
        </div>
        <div class="address-form-actions">
            {{SAVE_BTN}}
            {{CANCEL_BTN}}
        </div>
    </form>
</div>
