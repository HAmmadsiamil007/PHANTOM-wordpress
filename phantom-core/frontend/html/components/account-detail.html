<div class="account-detail" data-reveal>
    <div class="account-detail-header">
        <div class="account-detail-avatar">{{AVATAR}}</div>
        <div class="account-detail-greeting">
            <h3>{{GREETING}}</h3>
            <p>{{EMAIL}}</p>
        </div>
    </div>
    <div class="account-detail-info">
        <div class="account-detail-row">
            <span class="account-detail-label">First Name</span>
            <span class="account-detail-value">{{FIRST_NAME}}</span>
        </div>
        <div class="account-detail-row">
            <span class="account-detail-label">Last Name</span>
            <span class="account-detail-value">{{LAST_NAME}}</span>
        </div>
        <div class="account-detail-row">
            <span class="account-detail-label">Display Name</span>
            <span class="account-detail-value">{{DISPLAY_NAME}}</span>
        </div>
        <div class="account-detail-row">
            <span class="account-detail-label">Phone</span>
            <span class="account-detail-value">{{PHONE}}</span>
        </div>
    </div>
    <div class="account-detail-actions">
        {{EDIT_BTN}}
    </div>
</div>
