<section class="hero-section" data-component="hero" data-editable="true" data-settings-group="hero" data-token-group="hero" data-version="1.0" style="--hero-overlay-opacity: {{OVERLAY_OPACITY}}">
  <picture>
    <source media="(max-width: {{TABLET_BP}}px)" srcset="{{IMAGE_TABLET}}">
    <source media="(max-width: {{MOBILE_BP}}px)" srcset="{{IMAGE_MOBILE}}">
    <img data-asset="{{image_{{IMAGE}}}}" data-asset="{{image_}}"  src="{{IMAGE}}" alt="{{TITLE}}" class="hero-image" loading="{{LOADING}}">
  </picture>
  <div class="hero-content">
    <h1 class="hero-title">{{TITLE}}</h1>
    {{SUBTITLE_HTML}}
    {{DESCRIPTION_HTML}}
    <a href="{{BTN_URL}}" class="btn btn-primary hero-cta">{{BTN_TEXT}}</a>
  </div>
</section>
