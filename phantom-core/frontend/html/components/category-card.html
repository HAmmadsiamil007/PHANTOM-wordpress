<a href="{{URL}}" class="category-card" data-component="category-card" data-editable="true" data-settings-group="collections" data-token-group="collections" data-version="1.0" data-tilt data-reveal-item>
    <div class="category-card-bg">
        <img data-asset="{{image_{{IMAGE}}}}" data-asset="{{image_}}"  loading="lazy" src="{{IMAGE}}" alt="{{NAME}}">
        <div class="category-card-overlay"></div>
    </div>
    <div class="category-card-content">
        <span class="category-count">{{COUNT}}</span>
        <h3 class="category-name">{{NAME}}</h3>
        <span class="category-cta">{{CTA}} <i class="fas fa-arrow-right"></i></span>
    </div>
</a>
