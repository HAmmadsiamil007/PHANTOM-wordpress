<a href="{{URL}}" class="category-card category-card--minimal" data-reveal-item>
    <div class="category-card-bg category-card-bg--minimal">
        <img data-asset="{{image_{{IMAGE}}}" loading="lazy" src="{{IMAGE}}" alt="{{NAME}}">
    </div>
    <div class="category-card-content category-card-content--minimal">
        <span class="category-count category-count--minimal">{{COUNT}}</span>
        <h3 class="category-name category-name--minimal">{{NAME}}</h3>
        <span class="category-cta category-cta--minimal">{{CTA}}</span>
    </div>
</a>
