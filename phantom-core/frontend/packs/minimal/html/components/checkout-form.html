<div data-component="minimal-checkout-form" data-instance="{{minimal-checkout-form_id}}" data-token-group="minimal-checkout-form" class="checkout-form checkout-form--minimal" data-reveal>
    <div class="checkout-form-section checkout-form-section--minimal">
        <h3 class="checkout-form-heading checkout-form-heading--minimal">{{BILLING_HEADING}}</h3>
        <div class="checkout-form-fields checkout-form-fields--minimal">{{BILLING_FIELDS}}</div>
    </div>
    <div class="checkout-form-section checkout-form-section--minimal">
        <h3 class="checkout-form-heading checkout-form-heading--minimal">{{SHIPPING_HEADING}}</h3>
        <div class="checkout-form-fields checkout-form-fields--minimal">{{SHIPPING_FIELDS}}</div>
    </div>
    <div class="checkout-form-section checkout-form-section--minimal">
        <h3 class="checkout-form-heading checkout-form-heading--minimal">{{PAYMENT_HEADING}}</h3>
        <div class="checkout-form-payment checkout-form-payment--minimal">{{PAYMENT_METHODS}}</div>
    </div>
    <div class="checkout-form-actions checkout-form-actions--minimal">
        {{PLACE_ORDER_BTN}}
    </div>
</div>
