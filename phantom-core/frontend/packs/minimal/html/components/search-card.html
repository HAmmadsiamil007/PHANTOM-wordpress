<a href="{{URL}}" class="search-card search-card--minimal" data-reveal-item>
    <div class="search-card-icon search-card-icon--minimal">{{TYPE_ICON}}</div>
    <div class="search-card-body search-card-body--minimal">
        <h3 class="search-card-title search-card-title--minimal">{{TITLE}}</h3>
        <p class="search-card-excerpt search-card-excerpt--minimal">{{EXCERPT}}</p>
        <span class="search-card-meta search-card-meta--minimal">{{TYPE}} &middot; {{DATE}}</span>
    </div>
</a>
