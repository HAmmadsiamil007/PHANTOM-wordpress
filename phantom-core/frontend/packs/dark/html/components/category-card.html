<a href="{{URL}}" class="category-card category-card--dark" data-tilt data-reveal-item>
    <div class="category-card-bg category-card-bg--dark">
        <img data-asset="{{image_{{IMAGE}}}" loading="lazy" src="{{IMAGE}}" alt="{{NAME}}">
        <div class="category-card-overlay category-card-overlay--dark"></div>
    </div>
    <div class="category-card-content category-card-content--dark">
        <span class="category-count category-count--dark">{{COUNT}}</span>
        <h3 class="category-name category-name--dark">{{NAME}}</h3>
        <span class="category-cta category-cta--dark">{{CTA}} <i class="fas fa-arrow-right"></i></span>
    </div>
</a>
