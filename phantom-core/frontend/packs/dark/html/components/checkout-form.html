<div data-component="dark-checkout-form" data-instance="{{dark-checkout-form_id}}" data-token-group="dark-checkout-form" class="checkout-form checkout-form--dark" data-reveal>
    <div class="checkout-form-section checkout-form-section--dark">
        <h3 class="checkout-form-heading checkout-form-heading--dark">{{BILLING_HEADING}}</h3>
        <div class="checkout-form-fields checkout-form-fields--dark">{{BILLING_FIELDS}}</div>
    </div>
    <div class="checkout-form-section checkout-form-section--dark">
        <h3 class="checkout-form-heading checkout-form-heading--dark">{{SHIPPING_HEADING}}</h3>
        <div class="checkout-form-fields checkout-form-fields--dark">{{SHIPPING_FIELDS}}</div>
    </div>
    <div class="checkout-form-section checkout-form-section--dark">
        <h3 class="checkout-form-heading checkout-form-heading--dark">{{PAYMENT_HEADING}}</h3>
        <div class="checkout-form-payment checkout-form-payment--dark">{{PAYMENT_METHODS}}</div>
    </div>
    <div class="checkout-form-actions checkout-form-actions--dark">
        {{PLACE_ORDER_BTN}}
    </div>
</div>
