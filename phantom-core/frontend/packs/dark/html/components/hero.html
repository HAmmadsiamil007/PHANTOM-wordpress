<section class="hero-section hero-section--dark" style="--hero-overlay-opacity: {{OVERLAY_OPACITY}}">
  <picture>
    <source media="(max-width: {{TABLET_BP}}px)" srcset="{{IMAGE_TABLET}}">
    <source media="(max-width: {{MOBILE_BP}}px)" srcset="{{IMAGE_MOBILE}}">
    <img src="{{IMAGE}}" alt="{{TITLE}}" class="hero-image" loading="{{LOADING}}">
  </picture>
  <div class="hero-overlay-gradient"></div>
  <div class="hero-content">
    <h1 class="hero-title">{{TITLE}}</h1>
    {{SUBTITLE_HTML}}
    {{DESCRIPTION_HTML}}
    <a href="{{BTN_URL}}" class="btn btn-accent hero-cta">{{BTN_TEXT}}</a>
  </div>
</section>
