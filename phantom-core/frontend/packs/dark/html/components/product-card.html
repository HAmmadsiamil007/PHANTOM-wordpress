<div data-component="dark-product-card" data-instance="{{dark-product-card_id}}" data-token-group="dark-product-card" class="product-card product-card--dark" data-aos="fade-up">
    <div class="product-card-image">
        <div class="product-card-badge">{{BADGE}}</div>
        <a href="{{URL}}">
            <img data-asset="{{image_{{IMAGE}}}" loading="lazy" src="{{IMAGE}}" alt="{{NAME}}">
        </a>
        <div class="product-card-actions">
            <button class="action-btn" aria-label="Quick view"><i class="fas fa-eye"></i></button>
            <button class="action-btn" aria-label="Add to wishlist"><i class="fas fa-heart"></i></button>
        </div>
    </div>
    <div class="product-card-body">
        {{RATING}}
        <h3 class="product-card-title"><a href="{{URL}}">{{NAME}}</a></h3>
        {{CATEGORIES}}
        <div class="product-card-footer">
            <span class="product-card-price">{{PRICE}}</span>
            {{ATC_BUTTON}}
        </div>
    </div>
</div>
