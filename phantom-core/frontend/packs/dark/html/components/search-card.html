<a href="{{URL}}" class="search-card search-card--dark" data-reveal-item>
    <div class="search-card-icon search-card-icon--dark">{{TYPE_ICON}}</div>
    <div class="search-card-body">
        <h3 class="search-card-title search-card-title--dark">{{TITLE}}</h3>
        <p class="search-card-excerpt search-card-excerpt--dark">{{EXCERPT}}</p>
        <span class="search-card-meta search-card-meta--dark">{{TYPE}} &middot; {{DATE}}</span>
    </div>
    <div class="search-card-arrow search-card-arrow--dark">
        <i class="fas fa-arrow-right"></i>
    </div>
</a>
