<div class="checkout-form checkout-form--bold" data-reveal>
    <div class="checkout-form-section checkout-form-section--bold">
        <h3 class="checkout-form-heading checkout-form-heading--bold">{{BILLING_HEADING}}</h3>
        <div class="checkout-form-fields checkout-form-fields--bold">{{BILLING_FIELDS}}</div>
    </div>
    <div class="checkout-form-section checkout-form-section--bold">
        <h3 class="checkout-form-heading checkout-form-heading--bold">{{SHIPPING_HEADING}}</h3>
        <div class="checkout-form-fields checkout-form-fields--bold">{{SHIPPING_FIELDS}}</div>
    </div>
    <div class="checkout-form-section checkout-form-section--bold">
        <h3 class="checkout-form-heading checkout-form-heading--bold">{{PAYMENT_HEADING}}</h3>
        <div class="checkout-form-payment checkout-form-payment--bold">{{PAYMENT_METHODS}}</div>
    </div>
    <div class="checkout-form-actions checkout-form-actions--bold">
        {{PLACE_ORDER_BTN}}
    </div>
</div>
