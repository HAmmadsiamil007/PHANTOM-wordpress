<a href="{{URL}}" class="category-card category-card--bold" data-tilt data-reveal-item>
    <div class="category-card-bg category-card-bg--bold">
        <img loading="lazy" src="{{IMAGE}}" alt="{{NAME}}">
        <div class="category-card-overlay category-card-overlay--bold"></div>
    </div>
    <div class="category-card-content category-card-content--bold">
        <span class="category-count category-count--bold">{{COUNT}}</span>
        <h3 class="category-name category-name--bold">{{NAME}}</h3>
        <span class="category-cta category-cta--bold">{{CTA}} <i class="fas fa-arrow-right"></i></span>
    </div>
</a>
