<a href="{{URL}}" class="search-card search-card--bold" data-reveal-item>
    <div class="search-card-icon search-card-icon--bold">{{TYPE_ICON}}</div>
    <div class="search-card-body search-card-body--bold">
        <h3 class="search-card-title search-card-title--bold">{{TITLE}}</h3>
        <p class="search-card-excerpt search-card-excerpt--bold">{{EXCERPT}}</p>
        <span class="search-card-meta search-card-meta--bold">{{TYPE}} &middot; {{DATE}}</span>
    </div>
    <div class="search-card-arrow search-card-arrow--bold">
        <i class="fas fa-arrow-right"></i>
    </div>
</a>
