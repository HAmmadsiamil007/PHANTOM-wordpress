<!DOCTYPE html>
<html lang="en" data-component="page-bold-404" data-instance="{{slug}}-{{index}}" data-token-group="bold-404">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} — Not Found</title>
    {{HEAD_CSS}}
    {{PACK_CSS}}
</head>
<body class="bold-pack error-page">
    {{HEADER}}
    <main>
        <section class="error-hero error-hero--bold">
            <div class="container">
                <h1 class="error-code">404</h1>
                <h2>{{PAGE_TITLE}}</h2>
                <p>{{PAGE_SUBTITLE}}</p>
                <div class="hero-actions">
                    <a href="/" class="btn-primary">Go Home</a>
                    <a href="/shop" class="btn-secondary">Shop Now</a>
                </div>
            </div>
        </section>
    </main>
    {{FOOTER}}
    {{PACK_JS}}
    {{FOOTER_JS}}
</body>
</html>
